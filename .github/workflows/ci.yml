# Черновик CI для cuber454/Cartgames — кладётся в .github/workflows/ci.yml.
# Пока не залит: у токена нет scope `workflow`.

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Тесты движка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Прогнать тесты движка
        run: gradle :engine:test --no-daemon --stacktrace

  apk:
    name: Сборка APK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK берём из образа раннера
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-не задан}"
          ls "$ANDROID_HOME/platforms" 2>/dev/null | tail -5 || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      # gradle.properties заточен под контейнер в 2 ГБ: -Xmx896m и метаспейс
      # в 256 МБ. На раннере памяти больше, и компилятор Compose в этом
      # лимите не укладывается — падает с OutOfMemoryError: Metaspace.
      - name: Собрать debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

      - uses: actions/upload-artifact@v4
        with:
          name: cartgames-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
