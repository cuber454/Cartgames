# CI для cuber454/Cartgames: тесты на каждую правку, а на push в main —
# подписанная сборка, которую приложение находит само.
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      # Тесты движка — правила игр; тесты приложения — разбор файла обновления.
      # Вторые собирают и весь остальной код приложения: экран, который не
      # собирается, до релиза не доедет.
      #
      # Память задаём здесь так же, как в сборке APK: gradle.properties заточен
      # под контейнер в 2 ГБ (-Xmx896m и метаспейс в 256 МБ), а компилятору
      # Compose этого не хватает — падает с OutOfMemoryError: Metaspace.
      - name: Прогнать тесты
        run: |
          gradle :engine:test :app:testDebugUnitTest --no-daemon --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

  # Черновая сборка для pull request: ключа подписи на чужих ветках нет,
  # но APK под рукой — из артефактов прогона.
  apk:
    name: Сборка APK (черновик)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK берём из образа раннера
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-не задан}"
          ls "$ANDROID_HOME/platforms" 2>/dev/null | tail -5 || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      # gradle.properties заточен под контейнер в 2 ГБ: -Xmx896m и метаспейс
      # в 256 МБ. На раннере памяти больше, и компилятор Compose в этом
      # лимите не укладывается — падает с OutOfMemoryError: Metaspace.
      - name: Собрать debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

      - uses: actions/upload-artifact@v4
        with:
          name: cartgames-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # Релиз: подписанная сборка уезжает в GitHub Release вместе с update.txt.
  # По этому файлу приложение понимает, что вышла новая версия, и тянет APK.
  # Номер сборки — номер прогона CI, он только растёт.
  release:
    name: Релиз
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Разложить ключ подписи
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Нет секрета KEYSTORE_BASE64 — подписывать нечем" >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/cartgames-release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/cartgames-release.jks" >> "$GITHUB_ENV"

      - name: Собрать подписанный release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          gradle :app:assembleRelease --no-daemon --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            -PversionCode="${{ github.run_number }}" \
            -PversionName="0.9"

      - name: Собрать update.txt и переименовать APK
        env:
          RUN: ${{ github.run_number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          BUILD="0.9.$RUN"
          APK="cartgames-$BUILD.apk"
          mv app/build/outputs/apk/release/app-release.apk "$APK"
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          # Заголовок коммита едет в файл одной строкой: перенос строки сломал
          # бы разбор «ключ=значение» на стороне приложения.
          SUBJECT=$(git log -1 --pretty=%s | tr '\n' ' ')
          {
            echo "# Описание последней сборки. Читает его приложение (app/.../update/Update.kt)."
            echo "versionCode=$RUN"
            echo "versionName=0.9"
            echo "build=$BUILD"
            echo "apkUrl=https://github.com/$REPO/releases/download/v$BUILD/$APK"
            echo "sha256=$SHA"
            echo "notes=$SUBJECT"
          } > update.txt
          cat update.txt
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"

      - name: Выложить релиз
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create "v$BUILD" "$APK" update.txt \
            --repo "$REPO" \
            --title "Сборка $BUILD" \
            --notes "$(git log -1 --pretty=%s)"

      # Запасная дорога к новости о сборке: та же пара строк уезжает в ветку
      # release-info, откуда её отдаёт CDN jsDelivr (app/.../update/Update.kt,
      # MANIFEST_URL_CDN). Нужна на случай, когда у игрока не разрешается имя
      # github.com: имя cdn.jsdelivr.net разрешается, и новость доходит.
      #
      # Ветка не main — прогонов не запускает (workflow слушает только main), а
      # переписывается целиком: в ней нужен только свежий файл, история не
      # нужна. Кэш CDN сбрасываем руками: без сброса новая сборка доехала бы до
      # игрока не раньше, чем CDN сам решит перечитать ветку.
      - name: Опубликовать новость о сборке в ветке release-info
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # BUILD приходит из предыдущего шага (GITHUB_ENV).
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B release-info
          git add -f update.txt
          git commit -m "Новость о сборке $BUILD"
          git push -f origin release-info
          curl -sS "https://purge.jsdelivr.net/gh/$REPO@release-info/update.txt" || true
