kotlin.code.style=official

# Контейнер ограничен 2 ГБ памяти на всё сразу. Раньше здесь стояло -Xmx2g,
# и сборка APK падала: демон Gradle выедал лимит и его убивал OOM-killer.
org.gradle.jvmargs=-Xmx896m -XX:MaxMetaspaceSize=256m -XX:+UseSerialGC -Dfile.encoding=UTF-8
org.gradle.workers.max=1
org.gradle.parallel=false

# Компилятор Kotlin считает в том же процессе, а не в отдельном демоне:
# ещё один JVM в 2 ГБ не помещается.
kotlin.compiler.execution.strategy=in-process

android.useAndroidX=true
android.nonTransitiveRClass=true
